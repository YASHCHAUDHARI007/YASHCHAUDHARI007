<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Yash Chaudhari — Creative Developer</title>
<desc id="desc">An animated midnight cyberpunk-inspired developer banner with orbiting neon rings, a glowing central monogram, and moving particles.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070A16"/><stop offset=".52" stop-color="#171044"/><stop offset="1" stop-color="#061C2B"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5EE7FF"/><stop offset=".48" stop-color="#A78BFA"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".38"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<ellipse cx="950" cy="165" rx="260" ry="210" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#neon)" stroke-opacity=".75">
  <ellipse cx="955" cy="175" rx="190" ry="70" stroke-width="1.5" transform="rotate(-28 955 175)"><animateTransform attributeName="transform" type="rotate" from="-28 955 175" to="332 955 175" dur="32s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="955" cy="175" rx="150" ry="105" stroke-width="1.2" transform="rotate(55 955 175)"><animateTransform attributeName="transform" type="rotate" from="55 955 175" to="-305 955 175" dur="26s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="955" cy="175" rx="210" ry="120" stroke-width="1" stroke-dasharray="4 12" transform="rotate(10 955 175)"><animateTransform attributeName="transform" type="rotate" from="10 955 175" to="370 955 175" dur="42s" repeatCount="indefinite"/></ellipse>
</g>
<circle cx="955" cy="175" r="82" fill="#0A1025" stroke="url(#neon)" stroke-width="2" filter="url(#shine)"/>
<text x="955" y="193" text-anchor="middle" font-family="monospace" font-size="60" font-weight="700" fill="url(#neon)">YC</text>
<g fill="#67E8F9">
  <circle cx="790" cy="130" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1105" cy="115" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="260" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="260" r="2"><animate attributeName="opacity" values="1;.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="72" y="105" fill="#A5F3FC" font-size="14" letter-spacing="5">PORTFOLIO / 2026</text>
  <text x="68" y="169" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="-1">YASH CHAUDHARI</text>
  <rect x="72" y="192" width="92" height="4" rx="2" fill="url(#neon)"><animate attributeName="width" values="38;120;70;92" dur="5s" repeatCount="indefinite"/></rect>
  <text x="72" y="235" fill="#CBD5E1" font-size="20">I turn curious ideas into useful digital experiences.</text>
  <text x="72" y="278" fill="#67E8F9" font-family="monospace" font-size="13" letter-spacing="2">AI  ·  FULL STACK  ·  PRODUCT ENGINEERING</text>
</g>
<path d="M0 324 Q300 285 600 326 T1200 315" fill="none" stroke="url(#neon)" stroke-opacity=".4"/>
<text x="72" y="333" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="2">LEARN / BUILD / SHIP / REPEAT</text>
</svg>